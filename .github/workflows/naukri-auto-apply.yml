name: Naukri Auto Apply

on:
  schedule:
    - cron: '*/150 * * * *'  # Every 150 minutes
  
  workflow_dispatch:

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

jobs:
  apply:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Checkout resume branch
      uses: actions/checkout@v4
      with:
        ref: resume-upload
        path: resume-files

    - name: Copy resume to working directory
      run: |
        cp resume-files/Kaushal_CV.pdf ./Kaushal_CV.pdf

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libnss3 libnspr4 libdbus-3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libgbm1 libgtk-3-0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libasound2

    - name: Install Playwright dependencies
      run: |
        pip install playwright==1.47.0
        playwright install-deps chromium
        playwright install chromium

    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt

    - name: Create session file
      run: |
        echo "${{ secrets.SESSION_NAUKRI_JSON }}" > session_naukri.json

    - name: Run Auto Apply
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        python naukri_apply.py

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: application-logs
        path: |
          applications_log.csv
          debug_screenshots/
