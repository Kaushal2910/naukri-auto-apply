name: Naukri Auto Apply

on:
  schedule:
    - cron: '*/150 * * * *'
  workflow_dispatch:

env:
  PLAYWRIGHT_BROWSERS_PATH: /tmp/playwright

jobs:
  apply:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python -m playwright install-deps chromium
        python -m playwright install chromium

    - name: Login to Naukri
      env:
        NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
        NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
      run: |
        python login_capture.py naukri --auto-login

    - name: Run Auto Apply
      run: |
        python naukri_apply.py

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: application-results
        path: |
          applications_log.csv
          debug_screenshots/
