name: Naukri Auto Apply

on:
  schedule:
    - cron: '*/150 * * * *'  # Every 150 minutes
  
  workflow_dispatch:

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

jobs:
  apply:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Playwright and dependencies
      run: |
        pip install playwright==1.47.0
        playwright install-deps chromium
        playwright install chromium

    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt

    - name: Create session file
      env:
        SESSION_NAUKRI_JSON: ${{ secrets.SESSION_NAUKRI_JSON }}
      run: |
        echo "$SESSION_NAUKRI_JSON" > session_naukri.json
        python -c "import json; json.load(open('session_naukri.json'))" || { echo "Invalid JSON"; exit 1; }
        ls -la session_naukri.json

    - name: Run Auto Apply
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        python naukri_apply.py

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: application-logs
        path: |
          applications_log.csv
          debug_screenshots/
