name: Naukri Auto Apply

on:
  # Run every hour (adjust schedule as needed to avoid rate limits)
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours (safer for avoiding account bans)
  
  # Allow manual triggering from GitHub UI
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Test mode - no actual applications'
        required: false
        default: 'false'
        type: boolean

jobs:
  apply:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libnss3 libnspr4 libdbus-3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libgbm1 libgtk-3-0 libgbm1 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libasound2

    - name: Install Playwright dependencies
      run: |
        pip install playwright==1.47.0
        playwright install-deps chromium
        playwright install chromium

    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt

    - name: Download resume
      # This step allows uploading resume via GitHub Actions artifact
      # Or you could store it securely in GitHub Secrets as base64
      run: |
        echo "Creating placeholder resume file..."
        touch Kaushal_CV.pdf
        echo "Resume file ready"

    - name: Run Auto Apply
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        python naukri_apply.py
      # Note: Requires session_naukri.json uploaded as GitHub Secret
      # See README below for instructions on generating this file

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: application-logs
        path: |
          applications_log.csv
          debug_screenshots/
